<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FlatConnect Blog</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://flatconnect.in/blog/">
  <script>
    (function () {
      var slug = new URLSearchParams(window.location.search).get('post');
      window.location.replace(slug && /^[a-z0-9-]+$/.test(slug) ? 'posts/' + slug + '.html' : 'index.html');
    })();
  </script>
</head>
<body>
  <p>Opening the article. If nothing happens, <a href="index.html">go to the FlatConnect blog</a>.</p>
</body>
</html>
